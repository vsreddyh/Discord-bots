model:
  default: deepseek-v4-flash-free
  provider: custom
  base_url: http://zen-proxy:4000/v1
  api_key: zen-proxy

agent:
  max_turns: 90
  reasoning_effort: medium
  disabled_toolsets:
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - session_search
    - spotify
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

terminal:
  backend: local
  cwd: /workspace
  timeout: 180

approvals:
  mode: smart

session_reset:
  mode: none

memory:
  memory_enabled: true

group_sessions_per_user: false

discord:
  require_mention: true
  auto_thread: false
  reactions: true
  channel_skill_bindings:
    - id: "1535601629884317696"
      skills:
        - i-have-adhd

platform_toolsets:
  cli:
    - file
    - terminal
  discord:
    - hermes-god

_config_version: 33

onboarding:
  seen:
    profile_build_offered: true
  profile_build: off
