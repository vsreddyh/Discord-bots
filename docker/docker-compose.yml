# ──────────────────────────────────────────────────────
# Shared bot service definition. Every bot binds its own profile + workspace
# and gets its own Discord token/channel from the root .env. Per-bot values
# are injected via the `environment` merge in each service block.
# ──────────────────────────────────────────────────────
x-bot-base: &bot-base
  build:
    context: ../test
  user: "1000:1000"
  volumes:
    - ../tools:/tools:ro
  environment: &bot-base-environment
    HERMES_HOME: /hermes-home
    HOME: /hermes-home
    OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
    HERMES_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
    DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
    DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
    SEARXNG_URL: http://searxng:8080
    MONGODB_URI: ${MONGODB_URI:-}
    MONGODB_DB: ${MONGODB_DB:-hermes}
  restart: unless-stopped

services:

  # ──────────────────────────────────────────────────────
  # SearXNG — Private metasearch engine
  # ──────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    # run as root initially to create settings.yml on first run (volume is root-owned)
    user: "0:0"
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOSTNAME:-localhost}/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-}
    volumes:
      - searxng_data:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Health Connect sync endpoint (Android app → MongoDB).
  # MONGODB_URI/HEALTH_SYNC_TOKEN from root .env; posts to Discord using
  # the food bot's token/channel.
  # ──────────────────────────────────────────────────────
  health-api:
    build:
      context: ../docker/health-api
    user: "1000:1000"
    ports:
      - "8001:8000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
      HEALTH_SYNC_TOKEN: ${HEALTH_SYNC_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_FOOD:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_FOOD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Multiplexed bot gateway — ONE container serves 4 bots + dashboard.
  # HERMES_HOME (profiles/master) is the gateway home; story/money/
  # food/resumes are named profiles under profiles/master/profiles/. The
  # entrypoint renders each profile's config + writes each profile's .env
  # (Discord token/channel) from these env vars, which Hermes reads as
  # per-profile secrets (never merged into one global env).
  #
  # HERMES_DASHBOARD=1 runs dashboard alongside gateway in the SAME
  # container, supervised by s6 (mirrors official
  # nousresearch/hermes-agent where HERMES_DASHBOARD=1 enables the
  # dashboard s6 service). Port 9119 is exposed on this single service.
  #
  # ALL env comes from the single root .env (compose interpolation).
  # Deliberately NOT the whole root env (no proxy keys, and no host-oriented
  # SEARXNG_URL=localhost:8888, which would break web search in-container).
  # ──────────────────────────────────────────────────────
  gateway:
    <<: *bot-base
    # s6-overlay needs to start as root to s6-setuidgid 1000:1000 for services;
    # running the container as 1000:1000 breaks s6-applyuidgid (dashboard 9119 reset).
    user: "0:0"
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ../profiles/master:/hermes-home
      - ../workspace:/workspace
      - ../tools:/tools:ro
    environment:
      <<: *bot-base-environment
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-1}
      HERMES_DASHBOARD_HOST: ${HERMES_DASHBOARD_HOST:-0.0.0.0}
      HERMES_DASHBOARD_PORT: ${HERMES_DASHBOARD_PORT:-9119}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      DISCORD_BOT_TOKEN_STORY: ${DISCORD_BOT_TOKEN_STORY:-}
      DISCORD_HOME_CHANNEL_STORY: ${DISCORD_HOME_CHANNEL_STORY:-}
      DISCORD_BOT_TOKEN_MONEY: ${DISCORD_BOT_TOKEN_MONEY:-}
      DISCORD_HOME_CHANNEL_MONEY: ${DISCORD_HOME_CHANNEL_MONEY:-}
      DISCORD_BOT_TOKEN_FOOD: ${DISCORD_BOT_TOKEN_FOOD:-}
      DISCORD_HOME_CHANNEL_FOOD: ${DISCORD_HOME_CHANNEL_FOOD:-}
      DISCORD_BOT_TOKEN_RESUMES: ${DISCORD_BOT_TOKEN_RESUMES:-}
      DISCORD_HOME_CHANNEL_RESUMES: ${DISCORD_HOME_CHANNEL_RESUMES:-}
      USDA_API_KEY: ${USDA_API_KEY:-}

  # ──────────────────────────────────────────────────────
  # Retention — one-shot data lifecycle job, run via cron
  # (scripts/retention.sh run → docker compose run --rm retention).
  # Needs MONGODB_URI / MONGODB_DB only.
  # ──────────────────────────────────────────────────────
  retention:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../tools:/tools:ro
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    entrypoint: ["python3", "/tools/retention.py"]
    restart: "no"

  # ── Dev-only local MongoDB (ephemeral, HERMES_ENV=dev) ──────────
  # Activated via compose profile `dev` (COMPOSE_PROFILES=dev, set by
  # scripts/lib/common.sh when HERMES_ENV=dev). Prod never starts this.
  # No volume — fully ephemeral (data lost on `down`/`restart`), which is
  # intentional for temporary dev use.
  mongodb:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - dev

volumes:
  searxng_data:
