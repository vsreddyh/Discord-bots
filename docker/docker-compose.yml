services:

  # ──────────────────────────────────────────────────────
  # SearXNG — Private metasearch engine
  # ──────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOSTNAME:-localhost}/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-}
    volumes:
      - searxng_data:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Zen Proxy — credit-aware LLM proxy (OpenCode Zen → DeepInfra fallback).
  # Needs OPENCODE_API_KEY / DEEPINFRA_API_KEY from the root .env.
  # ──────────────────────────────────────────────────────
  zen-proxy:
    build:
      context: ../docker/proxy
    ports:
      - "4000:4000"
    env_file: ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Health Connect sync endpoint (Android app → MongoDB).
  # Needs MONGODB_URI (root .env) + food's Discord token/channel.
  # ──────────────────────────────────────────────────────
  health-api:
    build:
      context: ../docker/health-api
    user: "1000:1000"
    ports:
      - "8001:8000"
    env_file:
      - ../.env
      - ../profiles/food/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Bot gateways — 1 master coordinator + 4 domain bots.
  # Same image as the test stack (test/Dockerfile + entrypoint.sh), which
  # bakes in the hermes-god toolset. Each bot bind-mounts its own profile
  # (HERMES_HOME), workspace, and the shared /tools helper read-only.
  #
  # Env comes from the bot's own profiles/<bot>/.env (sourced by entrypoint).
  # Only MONGODB_URI/MONGODB_DB are injected from the root .env — deliberately
  # NOT the whole root env (no proxy keys, and no host-oriented
  # SEARXNG_URL=localhost:8888, which would break web search in-container).
  # ──────────────────────────────────────────────────────
  master:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../profiles/master:/hermes-home
      - ../workspace/master:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      SEARXNG_URL: http://searxng:8080
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  story:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../profiles/story:/hermes-home
      - ../workspace/story:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      SEARXNG_URL: http://searxng:8080
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  helldivers:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../profiles/helldivers:/hermes-home
      - ../workspace/helldivers:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      SEARXNG_URL: http://searxng:8080
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  money:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../profiles/money:/hermes-home
      - ../workspace/money:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      SEARXNG_URL: http://searxng:8080
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  food:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../profiles/food:/hermes-home
      - ../workspace/food:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      SEARXNG_URL: http://searxng:8080
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Dashboard — password-protected web UI for the master profile.
  # Auth (HERMES_DASHBOARD_BASIC_AUTH_*) comes from profiles/master/.env,
  # which entrypoint.sh sources. The package ships a prebuilt web_dist, so
  # --skip-build works without Node/npm. No root .env needed.
  # ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: ../test
    user: "1000:1000"
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ../profiles/master:/hermes-home
      - ../tools:/tools:ro
    environment:
      HERMES_MODE: dashboard
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Retention — one-shot data lifecycle job, run via cron
  # (scripts/retention.sh run → docker compose run --rm retention).
  # Needs MONGODB_URI / MONGODB_DB only.
  # ──────────────────────────────────────────────────────
  retention:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../tools:/tools:ro
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    entrypoint: ["python3", "/tools/retention.py"]
    restart: "no"

volumes:
  searxng_data:
