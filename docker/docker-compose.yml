# ──────────────────────────────────────────────────────
# Shared bot service definition. Every bot binds its own profile + workspace
# and gets its own Discord token/channel from the root .env. Per-bot values
# are injected via the `environment` merge in each service block.
# ──────────────────────────────────────────────────────
x-bot-base: &bot-base
  build:
    context: ../test
  user: "1000:1000"
  volumes:
    - ../tools:/tools:ro
  environment: &bot-base-environment
    HERMES_HOME: /hermes-home
    HOME: /hermes-home
    HERMES_API_KEY: ${HERMES_API_KEY:-zen-proxy}
    DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
    DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
    SEARXNG_URL: http://searxng:8080
    MONGODB_URI: ${MONGODB_URI:-}
    MONGODB_DB: ${MONGODB_DB:-hermes}
  depends_on:
    zen-proxy:
      condition: service_healthy
  restart: unless-stopped

services:

  # ──────────────────────────────────────────────────────
  # SearXNG — Private metasearch engine
  # ──────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOSTNAME:-localhost}/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-}
    volumes:
      - searxng_data:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Zen Proxy — credit-aware LLM proxy (OpenCode Zen → DeepInfra fallback).
  # Needs OPENCODE_API_KEY / DEEPINFRA_API_KEY from the root .env.
  # ──────────────────────────────────────────────────────
  zen-proxy:
    build:
      context: ../docker/proxy
    ports:
      - "4000:4000"
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Health Connect sync endpoint (Android app → MongoDB).
  # MONGODB_URI/HEALTH_SYNC_TOKEN from root .env; posts to Discord using
  # the food bot's token/channel.
  # ──────────────────────────────────────────────────────
  health-api:
    build:
      context: ../docker/health-api
    user: "1000:1000"
    ports:
      - "8001:8000"
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
      HEALTH_SYNC_TOKEN: ${HEALTH_SYNC_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_FOOD:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_FOOD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Bot gateways — 1 master coordinator + 4 domain bots.
  # Same image as the test stack (test/Dockerfile + entrypoint.sh), which
  # bakes in the hermes-god toolset. Each bot bind-mounts its own profile
  # (HERMES_HOME) + workspace.
  #
  # ALL env comes from the single root .env (compose interpolation), mapped
  # per service — one Discord token/home channel per bot. Deliberately NOT
  # the whole root env (no proxy keys, and no host-oriented
  # SEARXNG_URL=localhost:8888, which would break web search in-container).
  # ──────────────────────────────────────────────────────
  master:
    <<: *bot-base
    volumes:
      - ../profiles/master:/hermes-home
      - ../workspace/master:/workspace
      - ../tools:/tools:ro
    environment:
      <<: *bot-base-environment
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_MASTER:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_MASTER:-}

  story:
    <<: *bot-base
    volumes:
      - ../profiles/story:/hermes-home
      - ../workspace/story:/workspace
      - ../tools:/tools:ro
    environment:
      <<: *bot-base-environment
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_STORY:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_STORY:-}

  helldivers:
    <<: *bot-base
    volumes:
      - ../profiles/helldivers:/hermes-home
      - ../workspace/helldivers:/workspace
      - ../tools:/tools:ro
    environment:
      <<: *bot-base-environment
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_HELLDIVERS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_HELLDIVERS:-}

  money:
    <<: *bot-base
    volumes:
      - ../profiles/money:/hermes-home
      - ../workspace/money:/workspace
      - ../tools:/tools:ro
    environment:
      <<: *bot-base-environment
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_MONEY:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_MONEY:-}

  food:
    <<: *bot-base
    volumes:
      - ../profiles/food:/hermes-home
      - ../workspace/food:/workspace
      - ../tools:/tools:ro
    environment:
      <<: *bot-base-environment
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_FOOD:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_FOOD:-}
      USDA_API_KEY: ${USDA_API_KEY:-}

  # ──────────────────────────────────────────────────────
  # Dashboard — password-protected web UI for the master profile.
  # Auth (HERMES_DASHBOARD_BASIC_AUTH_*) comes from the root .env.
  # The package ships a prebuilt web_dist, so --skip-build works without
  # Node/npm.
  # ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: ../test
    user: "1000:1000"
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ../profiles/master:/hermes-home
      - ../tools:/tools:ro
    environment:
      HERMES_MODE: dashboard
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      HERMES_API_KEY: ${HERMES_API_KEY:-zen-proxy}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_MASTER:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_MASTER:-}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
    restart: unless-stopped

  # ──────────────────────────────────────────────────────
  # Retention — one-shot data lifecycle job, run via cron
  # (scripts/retention.sh run → docker compose run --rm retention).
  # Needs MONGODB_URI / MONGODB_DB only.
  # ──────────────────────────────────────────────────────
  retention:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../tools:/tools:ro
    environment:
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-hermes}
    entrypoint: ["python3", "/tools/retention.py"]
    restart: "no"

volumes:
  searxng_data:
