services:

  # ──────────────────────────────────────────────────────
  # SearXNG — Private metasearch engine
  # The ONLY dockerized service in the live stack. zen-proxy and health-api
  # run natively on the host (see scripts/hermes.sh); bots run natively too.
  # ──────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: https://${SEARXNG_HOSTNAME:-localhost}/
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-}
    volumes:
      - searxng_data:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

volumes:
  searxng_data:
