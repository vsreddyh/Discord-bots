services:

  zen-proxy:
    build:
      context: ../docker/proxy
    ports:
      - "4000:4000"
    env_file: ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── In-stack MongoDB for the test environment ──────────
  # Mirrors the remote cluster the native stack uses. Bots/health-api in the
  # test stack point here via MONGODB_URI=mongodb://mongodb:27017 (set by
  # entrypoint.sh / compose environment), never at the remote cluster.
  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Bot gateways ──────────────────────────────────────
  master:
    build: .
    user: "1000:1000"
    volumes:
      - ../profiles/master:/hermes-home
      - ../workspace/master:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      HERMES_API_KEY: ${HERMES_API_KEY:-zen-proxy}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_MASTER:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_MASTER:-}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  story:
    build: .
    user: "1000:1000"
    volumes:
      - ../profiles/story:/hermes-home
      - ../workspace/story:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      HERMES_API_KEY: ${HERMES_API_KEY:-zen-proxy}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_STORY:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_STORY:-}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  helldivers:
    build: .
    user: "1000:1000"
    volumes:
      - ../profiles/helldivers:/hermes-home
      - ../workspace/helldivers:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      HERMES_API_KEY: ${HERMES_API_KEY:-zen-proxy}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_HELLDIVERS:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_HELLDIVERS:-}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  money:
    build: .
    user: "1000:1000"
    volumes:
      - ../profiles/money:/hermes-home
      - ../workspace/money:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      HERMES_API_KEY: ${HERMES_API_KEY:-zen-proxy}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_MONEY:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_MONEY:-}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  food:
    build: .
    user: "1000:1000"
    volumes:
      - ../profiles/food:/hermes-home
      - ../workspace/food:/workspace
      - ../tools:/tools:ro
    environment:
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      HERMES_API_KEY: ${HERMES_API_KEY:-zen-proxy}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_FOOD:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_FOOD:-}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      USDA_API_KEY: ${USDA_API_KEY:-}
    depends_on:
      zen-proxy:
        condition: service_healthy
    restart: unless-stopped

  # ── Health Connect sync endpoint (Android app → MongoDB) ──
  health-api:
    build:
      context: ../docker/health-api
    user: "1000:1000"
    ports:
      - "8001:8000"
    env_file: ../.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: hermes
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_FOOD:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_FOOD:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Dashboard (mirrors live stack) ──────────────────
  dashboard:
    build:
      context: ../test
    user: "1000:1000"
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ../profiles/master:/hermes-home
      - ../tools:/tools:ro
    environment:
      HERMES_MODE: dashboard
      HERMES_HOME: /hermes-home
      HOME: /hermes-home
      HERMES_API_KEY: ${HERMES_API_KEY:-zen-proxy}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN_MASTER:-}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL_MASTER:-}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS:-true}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
    restart: unless-stopped

  # ── Retention one-shot (mirrors live stack) ─────────
  retention:
    build:
      context: ../test
    user: "1000:1000"
    volumes:
      - ../tools:/tools:ro
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: hermes
    entrypoint: ["python3", "/tools/retention.py"]
    restart: "no"

volumes:
  mongo_data:
